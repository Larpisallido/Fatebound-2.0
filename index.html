<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080809">
  <meta name="description" content="Fatebound — A Living World RPG">
  <title>Fatebound — A Living World RPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Crimson+Pro:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="lobby" aria-label="Fatebound main menu">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="distant-spires" aria-hidden="true">
      <span class="spire spire-a"></span><span class="spire spire-b"></span>
      <span class="spire spire-c"></span><span class="spire spire-d"></span>
      <span class="spire spire-e"></span><span class="spire spire-f"></span>
    </div>

    <div class="frame" aria-hidden="true">
      <i class="corner corner-tl"></i><i class="corner corner-tr"></i>
      <i class="corner corner-bl"></i><i class="corner corner-br"></i>
    </div>

    <section class="lobby-content">
      <header class="brand">
        <div class="ornament ornament-top" aria-hidden="true"><span></span><b>✦</b><span></span></div>
        <h1>FATEBOUND</h1>
        <p class="subtitle">A LIVING WORLD RPG</p>
        <div class="ornament ornament-bottom" aria-hidden="true"><span></span><b>✥</b><span></span></div>
      </header>

      <nav class="main-actions" aria-label="Main menu">
        <button class="menu-button primary" type="button" data-action="new-game">
          <span class="button-label">NEW GAME</span>
        </button>
        <button class="menu-button secondary" type="button" data-action="continue">
          <span class="button-label">CONTINUE</span>
        </button>
      </nav>

      <button class="settings-button" type="button" data-action="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9.8 2.8h4.4l.5 2.1c.5.2 1 .4 1.4.8l2.1-.6 2.2 3.8-1.6 1.5c.1.6.1 1.1 0 1.7l1.6 1.5-2.2 3.8-2.1-.6c-.4.3-.9.6-1.4.8l-.5 2.1H9.8l-.5-2.1c-.5-.2-1-.4-1.4-.8l-2.1.6-2.2-3.8 1.6-1.5a7 7 0 0 1 0-1.7L3.6 8.9l2.2-3.8 2.1.6c.4-.3.9-.6 1.4-.8z"/>
          <circle cx="12" cy="11.9" r="3.1"/>
        </svg>
        <span>SETTINGS</span>
      </button>
    </section>

    <div class="toast" id="lobbyToast" role="status" aria-live="polite"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
